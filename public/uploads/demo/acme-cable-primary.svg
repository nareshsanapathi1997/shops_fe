<text x="180" y="168" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="900">ACME FRLS</text>
<text x="180" y="190" text-anchor="middle" fill="#fdba74" font-family="monospace" font-size="13" font-weight="700">4.0 SQ.MM • 90M</text>

