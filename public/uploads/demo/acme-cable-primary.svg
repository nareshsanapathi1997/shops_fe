<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" rx="28" fill="url(#pbg)"/>
  <circle cx="400" cy="285" r="250" fill="url(#glow)"/>
  <!-- Top Badges -->
  <rect x="32" y="28" width="210" height="36" rx="18" fill="#0f172a"/>
  <text x="137" y="51" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">SKU: ACME-CBL-4SQ-90M</text>
  <rect x="578" y="28" width="190" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="673" y="51" text-anchor="middle" fill="#0f172a" font-family="monospace" font-size="13" font-weight="700">HSN 8544 • VERIFIED</text>
