  <ellipse cx="400" cy="462" rx="195" ry="24" fill="#0f172a" fill-opacity="0.12"/>
  <!-- Main Product Studio Graphic -->
  <g transform="translate(220, 95)">
    
<circle cx="180" cy="175" r="150" fill="#ea580c" stroke="#9a3412" stroke-width="10"/>
<circle cx="180" cy="175" r="120" fill="none" stroke="#fb923c" stroke-width="16" stroke-dasharray="28 12"/>
<circle cx="180" cy="175" r="92" fill="none" stroke="#fdba74" stroke-width="12" stroke-dasharray="22 10"/>
